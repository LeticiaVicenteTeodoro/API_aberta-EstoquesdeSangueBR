[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-doacao-sangue"
version = "1.0.1"
description = "API aberta para integração e padronização de dados sobre doação de sangue no Brasil."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "APScheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "selenium>=4.20",
    "SQLAlchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
api-doacao-sangue = "api_doacao_sangue.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_doacao_sangue*"]
